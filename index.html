<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <meta name="description" content="A bright little hello from the web.">
  <title>Hello, world! — A little joy on the web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>A little hello</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="gallery.html">Gallery</a>
      </nav>
    </header>
    <main>
      <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> Your tiny corner of the internet</p>
      <span class="sparkle" aria-hidden="true">✦</span>
      <h1>Hello,<br><span class="accent">world!</span></h1>
      <p class="subtitle">A small beginning, a little bit of color, and a warm hello sent your way.</p>
      <button class="hello-button" id="helloButton" type="button">
        <span>Send a little hello</span><span aria-hidden="true">↗</span>
      </button>
      <p class="reply" id="reply" aria-live="polite"></p>
    </main>
    <footer class="site-footer">Made with a little HTML, CSS &amp; good vibes</footer>
  </div>
  <script>
    const button = document.querySelector('#helloButton');
    const reply = document.querySelector('#reply');
    button.addEventListener('click', () => {
      reply.textContent = 'Hello right back at you ✨';
      button.querySelector('span').textContent = 'Hello sent!';
    });
  </script>
</body>
</html>
