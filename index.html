<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <meta name="description" content="A bright little hello from the web.">
  <title>Hello, world! — A little joy on the web</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ff;
      --muted: #b8bad0;
      --panel: rgba(255, 255, 255, .075);
      --line: rgba(255, 255, 255, .14);
      --pink: #ff8fb8;
      --gold: #ffd58a;
      --violet: #aa9aff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 32px 20px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 18% 15%, rgba(115, 90, 215, .24), transparent 38%),
        radial-gradient(ellipse at 85% 82%, rgba(227, 103, 155, .17), transparent 35%),
        #101322;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .glow {
      position: fixed;
      z-index: -1;
      width: 340px;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .28;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .glow.one { top: -150px; left: -100px; background: #8a72ff; }
    .glow.two { right: -130px; bottom: -180px; background: #ff82b4; animation-delay: -5s; }

    main {
      width: min(100%, 760px);
      position: relative;
      padding: clamp(28px, 7vw, 66px);
      border: 1px solid var(--line);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
      box-shadow: 0 32px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 28px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #e6dcff;
      background: rgba(255,255,255,.045);
      font-size: .76rem;
      font-weight: 650;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94f0c0;
      box-shadow: 0 0 12px #94f0c0;
    }

    .sparkle {
      display: block;
      margin-bottom: 12px;
      font-size: clamp(2.5rem, 7vw, 4rem);
      filter: drop-shadow(0 0 22px rgba(255,213,138,.35));
      animation: twinkle 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 10vw, 6.6rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 780;
    }
    h1 span {
      color: transparent;
      background: linear-gradient(100deg, var(--gold) 5%, var(--pink) 52%, var(--violet) 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle {
      max-width: 440px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.13rem);
      line-height: 1.7;
    }

    .hello-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      margin-top: 34px;
      padding: 0 23px;
      border: 0;
      border-radius: 16px;
      color: #20172b;
      background: linear-gradient(105deg, #ffdc9d, #ff9cc0 58%, #c1aaff);
      box-shadow: 0 10px 30px rgba(230, 134, 190, .24);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .hello-button:hover { transform: translateY(-3px); box-shadow: 0 15px 36px rgba(230, 134, 190, .35); }
    .hello-button:active { transform: translateY(0); }
    .hello-button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    .reply {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: #f5d9ee;
      font-size: .95rem;
    }

    .footer {
      margin: 40px 0 0;
      color: rgba(229, 226, 245, .52);
      font-size: .78rem;
      letter-spacing: .04em;
    }

    @keyframes drift { to { transform: translate(38px, 26px) scale(1.12); } }
    @keyframes twinkle { 50% { transform: translateY(-5px) rotate(8deg); } }

    @media (max-width: 520px) {
      main { border-radius: 25px; }
      .eyebrow { margin-bottom: 23px; font-size: .67rem; }
      .footer { margin-top: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>

  <main>
    <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> Your tiny corner of the internet</p>
    <span class="sparkle" aria-hidden="true">✦</span>
    <h1>Hello,<br><span>world!</span></h1>
    <p class="subtitle">A small beginning, a little bit of color, and a warm hello sent your way.</p>
    <button class="hello-button" id="helloButton" type="button">
      <span>Send a little hello</span><span aria-hidden="true">↗</span>
    </button>
    <p class="reply" id="reply" aria-live="polite"></p>
    <p class="footer">Made with a little HTML, CSS &amp; good vibes</p>
  </main>

  <script>
    const button = document.querySelector('#helloButton');
    const reply = document.querySelector('#reply');
    button.addEventListener('click', () => {
      reply.textContent = 'Hello right back at you ✨';
      button.querySelector('span').textContent = 'Hello sent!';
    });
  </script>
</body>
</html>
